---
# ============================================================================
# Lista definitiva de herramientas del devbox
# Agregar una herramienta acá no requiere tocar deploy.yml
# ============================================================================

# Base: paquetes que vienen de los repos de Ubuntu
apt_tools:
  - git
  - curl
  - jq
  - unzip
  # Lenguajes
  - python3
  - python3-pip
  - python3-venv
  # Escritorio / seguridad (el resto lo instalan tareas dedicadas)
  - fail2ban

# Escritorio: KasmVNC (paquete oficial para Ubuntu 24.04 noble)
kasmvnc_version: "1.3.4"
kasmvnc_deb_url: "https://github.com/kasmtech/KasmVNC/releases/download/v1.3.4/kasmvncserver_noble_1.3.4_amd64.deb"

# Node.js LTS (NodeSource)
nodejs_major_version: "22"

# Terraform / kubectl / Helm / Ansible / hcloud (KooCLI) / Podman
install_terraform: true
install_kubectl: true
install_helm: true
install_ansible: true
install_koocli: true
install_podman: true

# Mismo origen que usa el Dockerfile del agente agent-huawei. Ojo: el host de
# ap-southeast-1 devuelve 404, el que sirve el tarball es ap-southeast-3.
koocli_url: "https://ap-southeast-3-hwcloudcli.obs.ap-southeast-3.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz"

helm_version: "v3.16.3"
helm_url: "https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz"

# Editor / navegador
install_vscode: true
install_chrome: true

# IA
install_claude_code: true
install_goose: true
# Antigravity: tarea tolerante a fallo. Si la descarga no resuelve,
# el playbook avisa en el log y sigue. Se instala despues desde el Chrome
# del escritorio.
install_antigravity: true
# Vacio a proposito: la URL que probamos daba 404 y no hay un .deb oficial
# estable al que apuntar. Con este valor vacio el playbook avisa en el log y
# sigue, tal como estaba previsto. Si conseguis la URL, pegala aca y se instala
# sola en la proxima corrida.
antigravity_deb_url: ""
